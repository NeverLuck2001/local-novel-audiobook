[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-novel-audiobook"
version = "0.3.0"
description = "Offline Chinese novel audiobook production with resumable segment generation"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "EbookLib==0.20", "beautifulsoup4>=4.12,<5", "lxml>=5,<7",
  "PyYAML>=6,<7", "charset-normalizer>=3,<4", "numpy>=1.26,<3",
  "soundfile>=0.13,<1", "rapidfuzz>=3,<4", "Pillow>=11,<13",
  "filelock>=3,<4", "pydantic>=2.10,<3"
]

[project.optional-dependencies]
tts = ["qwen-tts==0.1.1"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "psutil>=6,<8"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
audiobook = "local_audiobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_audiobook = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
